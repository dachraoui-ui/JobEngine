version: '3.8'

services:
  # ==================================================
  # MongoDB — Database for JobEngine
  # ==================================================
  mongodb:
    image: mongo:7.0
    container_name: jobengine-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jobengine

  # ==================================================
  # Mongo Express — Web UI to browse the database
  # Access at: http://localhost:8081
  # ==================================================
  mongo-express:
    image: mongo-express:1.0
    container_name: jobengine-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
