spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/jobengine
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:jobengine-super-secret-key-that-is-256-bits-long-for-hmac-sha256-algorithm}
  expiration: 86400000  # 24 hours in milliseconds

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

n8n:
  webhook:
    base-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook}

server:
  port: 8088

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
