spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/jobengine
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET:jobengine-super-secret-key-that-is-256-bits-long-for-hmac-sha256-algorithm}
  expiration: 86400000  # 24 hours in milliseconds

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

gemini:
  api:
    key: AQ.Ab8RN6KRQXtbyUTEQJ7oxqeMnvI8LZZML0eHXRLMB6Tvzy08Sg
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta
n8n:
  webhook:
    base-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook}

app:
  mail:
    from: ${MAIL_FROM:no-reply@jobengine.local}

server:
  port: 8088

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
